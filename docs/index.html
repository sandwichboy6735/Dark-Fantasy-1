<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Moonveil</title>
<meta name="description" content="A moonlit fantasy realm of floating castles, goblin markets and quiet folk. Wander, glide and talk. No fighting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Almendra:ital,wght@0,400;0,700;1,400&display=swap">
<style>:root {
  color-scheme: dark;
  --night: #07071a;
  --ink: #e9e6ff;
  --ink-dim: #a9a6d6;
  --moon: #cfd4ff;
  --ember: #ffb45e;
  --violet: #8e86ff;
  --display: 'Almendra Display', 'Almendra', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --body: 'Almendra', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
}
html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); overflow: hidden; }
body { font-family: var(--body); -webkit-font-smoothing: antialiased; }
#game { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--night); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--moon); outline-offset: 4px; }
[hidden] { display: none !important; }

/* ---------- Title ---------- */
#title { position: absolute; inset: 0; display: grid; place-items: end center; padding: 16px 16px calc(9vh + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, rgba(7, 7, 26, 0) 40%, rgba(7, 7, 26, 0.75) 100%); cursor: pointer; }
.title-inner { display: grid; justify-items: center; gap: 14px; text-align: center; width: min(640px, 100%); }
h1 { font-family: var(--display); font-weight: 400; margin: 0; font-size: clamp(3.4rem, 15vw, 7.5rem); line-height: 0.9; letter-spacing: 0.02em; color: #f2f0ff;
  text-shadow: 0 0 24px rgba(160, 170, 255, 0.75), 0 0 80px rgba(110, 100, 255, 0.5), 0 3px 0 rgba(0, 0, 0, 0.6); }
.tagline { margin: 0; font-style: italic; font-size: clamp(1rem, 3.6vw, 1.3rem); color: var(--ink-dim); text-shadow: 0 1px 8px #000; text-wrap: balance; }
.loading { margin: 10px 0 0; display: grid; gap: 10px; justify-items: center; color: var(--ink-dim); font-style: italic; }
.bar { display: block; width: 180px; height: 1px; background: rgba(207, 212, 255, 0.2); }
#loadBar { display: block; height: 100%; width: 0; background: var(--moon); box-shadow: 0 0 8px var(--moon); transition: width .2s; }
.begin { margin-top: 12px; font-family: var(--display); font-size: clamp(1.4rem, 5vw, 2rem); color: #fff; text-shadow: 0 0 18px rgba(255, 180, 94, 0.8), 0 0 4px rgba(255, 180, 94, 0.8); animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
.anew { font-size: 0.95rem; color: var(--ink-dim); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(169, 166, 214, 0.4); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
body.photo #hud, body.photo #touch { display: none !important; }
#compass { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 140px)); height: 34px; overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(to right, transparent, #000 22%, #000 78%, transparent); }
#compassStrip { position: absolute; inset: 0; }
#compassStrip span { position: absolute; top: 6px; transform: translateX(-50%); font-size: 0.95rem; color: var(--ink); text-shadow: 0 1px 4px #000; white-space: nowrap; }
#compassStrip span.dir { font-family: var(--display); font-size: 1.05rem; }
#compassStrip span.place { top: 9px; font-size: 0.7rem; color: var(--ember); }
#compassStrip span.place.unknown { color: var(--ink-dim); }
.compass-tick { position: absolute; left: 50%; bottom: 0; width: 1px; height: 7px; background: var(--moon); }
#banner { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); width: min(680px, calc(100% - 32px)); text-align: center; opacity: 0; transition: opacity 1.4s ease; display: grid; gap: 4px; }
#banner.show { opacity: 1; }
#bannerKicker { margin: 0; font-size: 0.95rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ember); text-shadow: 0 1px 6px #000; }
#banner h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 7vw, 3.4rem); color: #fff; text-shadow: 0 0 22px rgba(150, 160, 255, 0.7), 0 2px 10px #000; text-wrap: balance; }
#banner p#bannerSub { margin: 0; font-style: italic; font-size: 1.15rem; color: var(--ink-dim); text-shadow: 0 1px 8px #000; }
#whisper { position: absolute; left: 50%; top: 36%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); text-align: center; font-style: italic; font-size: 1.15rem; color: var(--moon); text-shadow: 0 0 14px rgba(160, 170, 255, 0.6), 0 1px 4px #000; opacity: 0; transition: opacity 1s ease; }
#whisper.show { opacity: 1; }
#prompt { position: absolute; left: 50%; bottom: calc(18% + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font-size: 1.15rem; text-shadow: 0 1px 6px #000, 0 0 2px #000; white-space: nowrap; }
.key { display: inline-grid; place-items: center; min-width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--moon); color: var(--moon); font-size: 0.9rem; box-shadow: 0 0 10px rgba(160, 170, 255, 0.4); }
#dialogue { position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(720px, calc(100% - 32px)); padding: 22px 26px 18px;
  background: radial-gradient(ellipse at 50% 120%, rgba(40, 34, 90, 0.92), rgba(10, 9, 30, 0.9) 70%); border-top: 1px solid rgba(207, 212, 255, 0.35); pointer-events: auto; cursor: pointer; }
#dialogue .who { margin: 0 0 8px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
#dlgName { font-family: var(--display); font-size: 1.6rem; color: var(--ember); text-shadow: 0 0 12px rgba(255, 180, 94, 0.45); }
#dlgTitle { font-style: italic; color: var(--ink-dim); }
#dlgText { margin: 0; font-size: 1.2rem; line-height: 1.5; min-height: 3em; max-width: 62ch; }
#dialogue .more { position: absolute; right: 20px; bottom: 10px; margin: 0; color: var(--moon); animation: pulse 1.6s infinite; }
#menuBtn { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 14px; width: 42px; height: 42px; display: grid; place-items: center; pointer-events: auto; }
#menuBtn svg { width: 26px; height: 26px; fill: var(--moon); filter: drop-shadow(0 0 6px rgba(160, 170, 255, 0.7)); }

/* ---------- Menu ---------- */
#menu { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(12, 10, 40, 0.72), rgba(4, 4, 14, 0.92)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); overflow-y: auto; }
.menu-inner { display: grid; justify-items: center; gap: 12px; text-align: center; width: min(520px, 100%); padding-block: 20px; }
#menu h2 { font-family: var(--display); font-weight: 400; font-size: 3rem; margin: 0 0 6px; text-shadow: 0 0 20px rgba(160, 170, 255, 0.6); }
.link { font-family: var(--display); font-size: 1.6rem; color: #fff; text-shadow: 0 0 12px rgba(255, 180, 94, 0.5); }
.link:hover { color: var(--ember); }
.link.small { font-family: var(--body); font-size: 1.05rem; color: var(--ink-dim); text-shadow: none; }
.link.small:hover { color: var(--ink); }
.found { display: grid; gap: 6px; justify-items: center; margin: 8px 0; }
.count { margin: 0; color: var(--ember); letter-spacing: 0.08em; }
#foundList { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; max-width: 480px; color: var(--ink-dim); font-size: 0.95rem; }
#foundList li.no { opacity: 0.35; }
.controls { margin: 10px 0 0; color: var(--ink-dim); font-size: 0.9rem; line-height: 1.7; max-width: 46ch; }

/* ---------- Touch ---------- */
#touch { position: absolute; inset: 0; pointer-events: none; }
#stick { position: absolute; left: 22px; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 130px; height: 130px; border-radius: 50%; border: 1px solid rgba(207, 212, 255, 0.25); background: radial-gradient(circle, rgba(207, 212, 255, 0.06), rgba(207, 212, 255, 0)); pointer-events: auto; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(207, 212, 255, 0.22); box-shadow: 0 0 14px rgba(160, 170, 255, 0.4); }
#tJump, #tTalk { position: absolute; right: 22px; width: 78px; height: 78px; border-radius: 50%; border: 1px solid rgba(207, 212, 255, 0.35); background: radial-gradient(circle, rgba(60, 60, 140, 0.45), rgba(20, 20, 50, 0.3)); font-family: var(--display); font-size: 1.1rem; pointer-events: auto; text-shadow: 0 1px 4px #000; }
#tJump { bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
#tTalk { bottom: calc(122px + env(safe-area-inset-bottom, 0px)); border-color: var(--ember); color: var(--ember); }
#tJump.on { background: radial-gradient(circle, rgba(120, 130, 255, 0.6), rgba(40, 40, 90, 0.4)); }
body.touch #prompt .key { display: none; }

@media (prefers-reduced-motion: reduce) { .begin, #dialogue .more { animation: none; } #banner, #whisper { transition: none; } }
</style>

<div id="game">
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div id="compass" aria-hidden="true"><div id="compassStrip"></div><div class="compass-tick"></div></div>
    <div id="banner"><p id="bannerKicker">You have found</p><h2 id="bannerName"></h2><p id="bannerSub"></p></div>
    <div id="whisper"></div>
    <div id="prompt" hidden><span class="key" id="promptKey">E</span><span id="promptText"></span></div>
    <div id="dialogue" hidden>
      <p class="who"><span id="dlgName"></span><span id="dlgTitle"></span></p>
      <p id="dlgText"></p>
      <p class="more" id="dlgMore">&#9656;</p>
    </div>
    <button id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3a8.5 8.5 0 1 0 5.5 15A9.5 9.5 0 0 1 15.5 3z"/></svg></button>
  </div>

  <div id="menu" hidden>
    <div class="menu-inner">
      <h2>Moonveil</h2>
      <button class="link" id="resumeBtn">Return to the realm</button>
      <div class="found">
        <p class="count" id="foundCount"></p>
        <ul id="foundList"></ul>
        <p class="count" id="metCount"></p>
      </div>
      <button class="link small" id="soundBtn">Sound: on</button>
      <button class="link small" id="qualityBtn">Graphics: beautiful</button>
      <p class="controls" id="controlsText"></p>
    </div>
  </div>

  <div id="title">
    <div class="title-inner">
      <h1>Moonveil</h1>
      <p class="tagline">A realm of floating castles, warm windows and quiet folk</p>
      <p class="loading" id="loading"><span id="loadText">The moon is rising</span><span class="bar"><span id="loadBar"></span></span></p>
      <button class="begin" id="beginBtn" hidden>Tap to begin</button>
      <button class="anew" id="anewBtn" hidden>Begin a new journey</button>
    </div>
  </div>

  <div id="touch" hidden>
    <div id="stick"><div id="stickKnob"></div></div>
    <button id="tJump" aria-label="Jump, hold to glide">Jump</button>
    <button id="tTalk" aria-label="Talk" hidden>Talk</button>
  </div>
</div>

"Pip",title:"Bard of Emberlight",x:5,z:38,beh:"wander",radius:12,voice:1.3,o:{robe:"#6a2a4a",hood:!1,hat:"#3a2a5a",feather:"#e0c060",lute:!0,hair:"#c08040"},lines:["A song? I only know one. It\u2019s about a goblin who lost his monocle.","\u266A Oh the moon is round and the night is long, and Grizzleby\u2019s monocle\u2019s gone, gone, gone \u266A","The goblins in the Market say it isn\u2019t lost. They say he sold it. To himself."]},{type:"villager",name:"Sister Aldith",title:"Keeper of the Chapel",x:6,z:-22,beh:"idle",face:0,o:{robe:"#56566a",hoodColor:"#3a3a4a"},lines:["Our bell rings for the Moon Queen. She has never once rung back.","They say she lives on the last floating island, past Starfall Point. The stones drift out to her."]},{type:"villager",name:"Marta",title:"Weaver",x:-62,z:20,beh:"wander",radius:8,o:{robe:"#3a4a6a",hood:!1,hair:"#2a1a1a",apron:"#c0a080"},lines:["I weave cloaks for wizards. The trick is to leave room for the stars.","Yours is a fine cloak. A little dusty. Have you been gliding?"]},{type:"villager",name:"Nell",title:"A village child",x:20,z:50,beh:"wander",radius:18,speed:2.6,voice:1.7,o:{child:!0,robe:"#8a4a3a",hood:!1,hair:"#e0a040"},lines:["Tag! You\u2019re it!","My brother says the dragon on the Moonspire is real. I say it\u2019s just a very big bat."]},{type:"villager",name:"Bram",title:"A village child",x:26,z:44,beh:"wander",radius:18,speed:2.4,voice:1.6,o:{child:!0,robe:"#3a5a4a",hood:!1,hair:"#4a2a1a"},lines:["It IS a dragon. Her name is Vessryn and she circles the mountain every night.","She never lands. Nobody knows where she sleeps."]},{type:"villager",name:"Hollis",title:"Blacksmith",x:82,z:18,beh:"idle",face:-1.2,o:{robe:"#3a3230",hood:!1,hair:"#1a1a1a",apron:"#5a4030",tool:!0,skin:"#c89878"},lines:["I forge lantern hooks. The goblins buy every single one.","What do goblins do with so many lanterns? I asked once. They sold me a lantern."]},{type:"villager",name:"Nan Greaves",title:"Oldest in Emberlight",x:-92,z:58,beh:"idle",face:1.2,voice:.85,o:{robe:"#4a3a4a",hoodColor:"#2e2430"},lines:["In my day the islands floated lower. You could jump onto them.","Now you need a good cloak and a better nerve.","Mind you, the view from up there hasn\u2019t changed a bit."]},{type:"villager",name:"Egbert",title:"Night Watchman",x:40,z:50,beh:"path",path:[[40,50],[120,70],[215,120],[235,230],[150,330],[235,230],[215,120],[120,70]],speed:1.3,o:{robe:"#3a3a4a",hat:"#2a2a2a",lantern:!0,hood:!1,hair:"#8a6a4a"},lines:["Quiet night. Every night\u2019s quiet. I\u2019m not complaining.","Twenty years on watch and the worst I\u2019ve seen is a goblin with a very loud hat."]},{type:"cat",name:"Soot",title:"The village cat",x:-18,z:38,beh:"wander",radius:10,speed:.8,voice:2,lines:["Mrrp.","(Soot stares at you as if you owe it money.)","(Soot allows you to exist. For now.)"]},{type:"wizard",name:"Theodric",title:"Scholar of the Moon",x:-40,z:112,beh:"idle",face:.4,voice:.8,o:{robe:"#4a3a2a",hat:"#3a2a1a",orb:"#ffd080"},lines:["I came here to study the moon. Forty years later I\u2019m still on the first page.","Did you know she never sets? She just drifts a little, like the islands.","Archmage Oriel\u2019s tower is west of the Goblin Market. Ask him about the lifts of light."]},{type:"villager",name:"Charon",title:"Ferryman of the Mirror Lake",x:0,z:205,y:18.4,beh:"boat",voice:.6,o:{robe:"#1e1c28",hoodColor:"#141218",lantern:!0},lines:["Room for one more. There is always room for one more.","I row from one shore to the other, and back. It is very relaxing. You should try it."]},{type:"knight",name:"Sir Aldric",title:"Warden of the Gate",x:-315,z:-463,beh:"idle",face:.3,lines:["Halt! Who goes... oh. A wizard. Go on, then.","The Moonlift is right behind me. Step into the blue light and it will carry you up to the castle."]},{type:"knight",name:"Sir Gorm",title:"Guard of the Walls",x:-375,z:-541,beh:"path",path:[[-375,-541],[-388,-541],[-388,-552],[-375,-552]],speed:.9,voice:.8,o:{tabard:"#5a1a2a",plume:"#e0c060"},lines:["Thirty years I\u2019ve guarded these walls. Never once been attacked.","Best job in the realm. Terrible for stories, though."]},{type:"knight",name:"Dame Beatrix",title:"Captain of Vaelmoor",x:-371,z:-553,beh:"idle",face:.8,voice:1.15,o:{tabard:"#2a4a5a",plume:"#c0e0ff",shield:"#2a3a6a"},lines:["We keep watch over the snow road. Travellers get lost in the Frostfangs.","If you see a light moving on the mountain at night, it\u2019s only Brother Oswin. He walks the road every night and never arrives."]},{type:"queen",name:"Lady Isolde",title:"Lady of Vaelmoor",x:-386,z:-545,beh:"idle",face:0,voice:1.1,o:{robe:"#6a1e2a",trim:"#ffb060",hair:"#2a1a1a",crown:"#ffd080",skin:"#ecd8c8"},lines:["Welcome to Vaelmoor. Every window is lit so travellers in the snow always know the way home.","My family has kept the lights burning for four hundred winters.","We are running a little low on candles. If you see Hollis the blacksmith, tell him the goblins can spare a few."]},{type:"villager",name:"Squire Ned",title:"Polisher of Armour",x:-384,z:-540,beh:"wander",radius:4,voice:1.4,o:{robe:"#5a5a70",hood:!1,hair:"#c09050"},lines:["I polish the armour. All of it. Every day.","Sir Gorm\u2019s helmet is so shiny now he can see the moon in it."]},{type:"villager",name:"Brother Oswin",title:"Pilgrim of the Snow Road",x:-150,z:-200,beh:"path",path:[[-80,-60],[-150,-200],[-230,-330],[-290,-430],[-230,-330],[-150,-200]],speed:.9,voice:.9,o:{robe:"#7a6a5a",hoodColor:"#5a4a3a",lantern:!0},lines:["I walk to Vaelmoor every night. I never quite arrive.","I think the road likes me. It keeps me company."]},{type:"villager",name:"Hermit Ulla",title:"Of the High Snows",x:60,z:-600,beh:"idle",face:0,voice:.9,o:{robe:"#d0ccd8",hoodColor:"#a8a4b8",skin:"#d8b8a0"},lines:["Up here the snow falls upward, if you\u2019re patient enough to watch.","That mountain is the Moonspire. The dragon Vessryn circles it. She\u2019s shy, not fierce."]},{type:"goblin",name:"Grizzleby Quint",title:"Purveyor of Fine Things",x:-640,z:118,beh:"idle",face:0,voice:.75,o:{monocle:!0,lantern:!0,vest:"#8a1a24"},lines:["Ahh, a customer! Welcome, welcome to the finest stall in the Goblin Market!","Everything\u2019s for sale. Well. Everything except the monocle. And the waistcoat. And the lantern.","No coin? No matter. A smile is worth... well, not much, but I\u2019ll take it.","If that bard in Emberlight tells you I lost my monocle, he is a liar. I misplaced it. Briefly."]},{type:"goblin",name:"Nettle",title:"Berry Seller",x:-600,z:125,beh:"idle",face:-1.4,voice:1.2,o:{vest:"#2a5a3a",skin:"#7a8a40"},lines:["Moonberries! Glowberries! Berries that are probably fine!","Eat a glowberry and you\u2019ll see in the dark. Eat two and the dark will see you."]},{type:"goblin",name:"Snagtooth",title:"Collector of Buttons",x:-690,z:170,beh:"wander",radius:10,voice:.9,o:{vest:"#4a3a6a",hat:"#2a2a2a"},lines:["You have EXCELLENT buttons.","No, I don\u2019t want to buy them. I want to admire them. From very close. For a long time."]},{type:"goblin",name:"Madame Wort",title:"Teller of Fortunes",x:-672,z:112,beh:"idle",face:.9,voice:1.1,o:{vest:"#5a2a6a",eyes:"#c080ff",lantern:!0},lines:["I see... a long journey. And a very big moon. That will be three coppers.","I also see floating stones and a queen made of moonlight. That one\u2019s free."]},{type:"goblin",name:"Gibbet",title:"One of the Gobbo Twins",x:-610,z:160,beh:"wander",radius:12,speed:1.6,voice:1.4,o:{vest:"#8a6a2a"},lines:["We\u2019re not twins. He\u2019s just copying me."]},{type:"goblin",name:"Gobbet",title:"The other Gobbo Twin",x:-606,z:164,beh:"wander",radius:12,speed:1.6,voice:1.45,o:{vest:"#8a6a2a"},lines:["We\u2019re not twins. He\u2019s just copying me."]},{type:"goblin",name:"Old Crumb",title:"Elder of the Market",x:-650,z:150,beh:"idle",face:Math.PI,voice:.6,o:{vest:"#3a3030",skin:"#5a6a3a",monocle:!0},lines:["This Market has been here since the first goblin found a hole and said: this will do.","Goblins aren\u2019t greedy. We\u2019re just very, very enthusiastic about things."]},{type:"goblin",name:"Fidget",title:"Market Runner",x:-620,z:140,beh:"wander",radius:25,speed:3,voice:1.8,o:{vest:"#2a4a6a"},lines:["Can\u2019t stop! Delivering a lantern! To another goblin! Who sells lanterns!"]},{type:"witch",name:"Mother Hemlock",title:"Brewer of the Witchwood",x:604,z:-52,beh:"idle",face:2.2,voice:.85,o:{robe:"#2a3a2a",hat:"#1a221a",hair:"#9a9a9a"},lines:["Stew\u2019s nearly ready. Don\u2019t ask what\u2019s in it. It\u2019s mostly mushrooms. Mostly.","The Witchwood looks spooky. It\u2019s actually very cosy, once the trees get to know you."]},{type:"witch",name:"Brambleweed",title:"Mushroom Whisperer",x:715,z:92,beh:"wander",radius:10,voice:1.1,o:{robe:"#3a2a4a",hair:"#2a4a2a"},lines:["The mushrooms glow because they\u2019re happy. Or angry. It\u2019s hard to tell with mushrooms.","Please don\u2019t step on the big blue ones. They\u2019re shy."]},{type:"witch",name:"Wren",title:"Apprentice Witch",x:570,z:128,beh:"wander",radius:8,voice:1.5,o:{robe:"#4a2a3a",hair:"#c05a2a"},lines:["I\u2019m learning to fly my broom. So far I\u2019ve learned to fall off it.","Elspeth and Agatha fly circles over the wood all night. Show-offs."]},{type:"witch",name:"Elspeth",title:"Night Flyer",x:640,z:20,y:60,beh:"fly",radius:90,speed:.12,o:{broom:!0,robe:"#2a2040"}},{type:"witch",name:"Agatha",title:"Night Flyer",x:660,z:0,y:75,beh:"fly",radius:140,speed:-.08,phase:2,o:{broom:!0,robe:"#3a1a2a",hair:"#1a1a1a"}},{type:"witch",name:"Grimalda",title:"Hermit of the Wood",x:700,z:-100,beh:"idle",face:-2.4,voice:.9,o:{robe:"#1e1a2a",hair:"#e0e0e0"},lines:["Hmph. Visitors.","...Well, since you\u2019re here. The Moon Circle south of the lake hums when you stand in it. Go and listen."]},{type:"villager",name:"Mortimer",title:"Gravedigger",x:420,z:520,beh:"wander",radius:10,voice:.7,o:{robe:"#2a2a2a",hoodColor:"#1a1a1a",tool:!0},lines:["Quietest neighbours in the realm. Never borrow sugar.","The ghosts? Harmless. Lady Wisteria just likes to talk."]},{type:"ghost",name:"Lady Wisteria",title:"Resident, Stillwater Graves",x:410,z:490,beh:"float",radius:5,voice:1.3,o:{color:"#b0c8ff"},lines:["I\u2019m not haunting. I\u2019m visiting. Indefinitely.","The view of the moon from here is lovely. Four hundred years and it hasn\u2019t moved an inch."]},{type:"ghost",name:"Sir Percival the Late",title:"Formerly of Vaelmoor",x:445,z:505,beh:"float",radius:4,voice:.8,o:{color:"#9ae0ff"},lines:["I guarded Castle Vaelmoor for thirty years. Never once attacked.","Eventually I simply... drifted off. Tell Sir Gorm to take a walk now and then."]},{type:"ghost",name:"Little Bo",title:"Very good at hide and seek",x:400,z:480,beh:"float",radius:8,voice:1.9,o:{color:"#c0f0ff"},lines:["Want to play hide and seek? I\u2019m very good at it.","You\u2019ll never find me. I\u2019m the one that glows."]},{type:"wizard",name:"Fenwick",title:"Druid of the Moon Circle",x:-272,z:548,beh:"idle",face:-2.5,voice:.9,o:{robe:"#2a4a3a",hat:"#1e3a2a",orb:"#a0ffb0",beardColor:"#c0c8a0"},lines:["When the moon is full, the stones hum. She is always full. They are always humming.","Stand still and listen. The realm is floating, you know. You can almost feel it bob."]},{type:"villager",name:"Tam",title:"Apprentice to the Archmage",x:-752,z:-244,beh:"idle",face:.3,voice:1.4,o:{robe:"#4a2a6a",hood:!1,hair:"#2a1a1a"},lines:["The Archmage is at the top. The Moonlift is right there. Step into the light.","He doesn\u2019t use the stairs. There are no stairs. He says stairs are for people without imagination."]},{type:"wizard",name:"Archmage Oriel",title:"Keeper of the Tower",x:-758,z:-262,beh:"isle",face:0,voice:.7,o:{robe:"#4a2a7a",hat:"#2a1a4a",hatH:1.1,orb:"#d0a0ff"},lines:["Ah. You found the lift. Most visitors knock for three days.","From up here you can see all of Moonveil. The islands drift, but they always come back.","Those lights in the clouds to the south-west are the Moon Queen\u2019s castle. Starfall Point is the way.","Glide off my tower if you like. Everyone does. It\u2019s the best part."]},{type:"villager",name:"Keeper Maud",title:"Keeper of Starwatch Light",x:126,z:1180,beh:"idle",face:Math.PI,voice:1.05,o:{robe:"#2a3a5a",hood:!1,hair:"#d0d0d0",lantern:!0},lines:["Starwatch Light guides the sky-ships home.","There hasn\u2019t been a sky-ship in a hundred years. But you never know."]},{type:"villager",name:"Captain Rook",title:"Retired Sky-Sailor",x:-852,z:852,beh:"idle",face:-2.4,voice:.85,o:{robe:"#2a2a3a",hood:!1,hat:"#1a1a22",feather:"#c0d0ff",hair:"#5a4a3a"},lines:["Those stones float all the way out to the Moon Queen\u2019s island.","Jump, then hold Jump to glide. The blue lights on the stones will lift you back up.","And if you fall? The clouds are soft. They\u2019ll send you back here, more or less."]},{type:"queen",name:"Selene",title:"The Moon Queen",x:-1260,z:1290,beh:"isle",face:.8,voice:1.2,lines:["You crossed the stepping stones. Few wanderers do.","I let the islands drift so that the realm never grows still.","There is no end to Moonveil, little wizard. Only more moonlight. Go wherever you like."]},{type:"knight",name:"Sir Caelum",title:"Moonguard",x:-1250,z:1298,beh:"isle",face:.8,voice:.9,o:{steel:"#c8ccec",tabard:"#8088c8",plume:"#e8f0ff",cape:"#4a4e8a",shield:"#6a70b0"},lines:["The Queen welcomes all who make the crossing.","Mind the edge. It\u2019s a long way down, and the clouds only look like pillows."]},{type:"knight",name:"Dame Lyra",title:"Moonguard",x:-1270,z:1300,beh:"isle",face:.8,voice:1.1,o:{steel:"#c8ccec",tabard:"#8088c8",plume:"#e8f0ff",cape:"#4a4e8a",shield:"#6a70b0"},lines:["From here you can see the whole continent floating on the cloud sea.","Emberlight\u2019s lights are just there. Can you see them?"]}];var w_=.4,T_=1.8,Na=class{constructor(t,e,n){this.model=t,this.world=e,this.T=n,this.pos=new I,this.vel=new I,this.facing=0,this.grounded=!1,this.gliding=!1,this.swimming=!1,this.input={x:0,z:0,run:!1,jump:!1},this.jumpHeld=!1,this.camYaw=0,this
